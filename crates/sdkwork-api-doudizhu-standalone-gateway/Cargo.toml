[package]
name = "sdkwork-api-doudizhu-standalone-gateway"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
description = "SDKWork Doudizhu standalone host for the canonical API assembly."

[[bin]]
name = "sdkwork-api-doudizhu-standalone-gateway"
path = "src/main.rs"

[dependencies]
axum.workspace = true
sdkwork_api_doudizhu_assembly.workspace = true
sdkwork-web-bootstrap.workspace = true
sdkwork-iam-web-adapter.workspace = true
sdkwork-utils-rust.workspace = true
tokio.workspace = true
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
